<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Outfit:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  .post {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(145deg, #18aa32 0%, #0c57a9 65%);
    padding: 80px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
  }

  /* Decoración */
  .orb1 {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.07);
    top: -200px; right: -180px;
  }
  .orb2 {
    position: absolute;
    width: 380px; height: 380px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.05);
    top: -60px; right: 60px;
  }
  .orb3 {
    position: absolute;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    bottom: -80px; left: -60px;
  }
  .texture {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.04) 0%, transparent 50%);
  }

  /* Header */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: white;
    padding: 4px;
    flex-shrink: 0;
    overflow: hidden;
  }

  .brand-name {
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
  }

  .chip {
    font-size: 24px;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.15);
    padding: 10px 28px;
    border-radius: 50px;
    backdrop-filter: blur(8px);
  }

  /* Contenido */
  .mid {
    margin-top: auto;
    position: relative;
  }

  .tag {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 24px;
  }

  .headline {
    font-family: 'Nunito', sans-serif;
    font-size: 96px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.05;
    margin-bottom: 32px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.15);
  }

  .body {
    font-size: 34px;
    color: rgba(255,255,255,0.72);
    line-height: 1.6;
    max-width: 820px;
    margin-bottom: 60px;
  }

  /* Footer */
  .bot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .cta {
    font-size: 26px;
    font-weight: 700;
    color: #0b2133;
    background: #ffffff;
    padding: 18px 48px;
    border-radius: 50px;
  }

  .handle {
    font-size: 24px;
    color: rgba(255,255,255,0.38);
  }
</style>
</head>
